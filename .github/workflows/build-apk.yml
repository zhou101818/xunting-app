name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/preview-*.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK file
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/xunting-${{ github.run_number }}-debug.apk
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xunting-apk-${{ github.run_number }}
          path: out/*.apk

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 熏听记录 build ${{ github.run_number }}
          body: |
            熏听记录 安卓安装包（调试签名，仅供个人设备安装使用）。
            下载下方 xunting-*.apk 安装即可；安装时如提示未知来源，允许一次即可。
          files: out/*.apk
